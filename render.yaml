# Render Blueprint. CP0: one free web service hosting both dummy MCP servers.
services:
  - type: web
    name: gforensics-guard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn spike.dummy_mcp:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ARMORIQ_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
