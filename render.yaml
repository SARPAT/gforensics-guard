# Render Blueprint. One free web service hosting both MCP servers (gfg-telemetry, gfg-ops).
services:
  - type: web
    name: gforensics-guard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn servers.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ARMORIQ_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: GFG_MCP_TOKEN      # optional: MCP paths require it when set (ArmorIQ proxy must send it)
        sync: false
      - key: GFG_MCP_AUTH_MODE  # observe = let through + record how a token came in; enforce = 401 without it
        value: enforce
      - key: GFG_ADMIN_TOKEN    # optional: guards /sim/reset and /sim/scene
        sync: false
      # CP5: live runs from the web UI call ArmorIQ FROM this service (needs ARMORIQ_API_KEY above)
      - key: ARMORIQ_MCP_GFG_TELEMETRY_AUTH_TYPE
        value: bearer
      - key: ARMORIQ_MCP_GFG_TELEMETRY_TOKEN    # same value as GFG_MCP_TOKEN
        sync: false
      - key: ARMORIQ_MCP_GFG_OPS_AUTH_TYPE
        value: bearer
      - key: ARMORIQ_MCP_GFG_OPS_TOKEN          # same value as GFG_MCP_TOKEN
        sync: false
      - key: GFG_REQUESTER_EMAIL   # on-call SRE (ArmorIQ user + approval requester); never shown in the UI
        sync: false
